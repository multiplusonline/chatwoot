name: Multiplus Instagram build
on:
  push:
    branches: [feat/instagram-unified-login]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: multiplus-instagram-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      RAILS_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_USERNAME: postgres
      REDIS_URL: redis://localhost:6379
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure ephemeral test encryption
        run: |
          for key in PRIMARY_KEY DETERMINISTIC_KEY KEY_DERIVATION_SALT; do
            echo "ACTIVE_RECORD_ENCRYPTION_${key}=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          done
      - run: bundle exec rails db:create db:schema:load
      - name: Run changed backend specs and lint
        run: |
          git diff --name-only aed04e65f5c088d42c2b85304293e47367b6fe96 HEAD -- '*.rb' | xargs bundle exec rubocop --force-exclusion
          git diff --name-only aed04e65f5c088d42c2b85304293e47367b6fe96 HEAD -- 'spec/*_spec.rb' | xargs bundle exec rspec
      - name: Run changed frontend specs and lint
        run: |
          git diff --name-only aed04e65f5c088d42c2b85304293e47367b6fe96 HEAD -- '*.js' '*.vue' | xargs pnpm exec eslint
          git diff --name-only aed04e65f5c088d42c2b85304293e47367b6fe96 HEAD -- '*.spec.js' | xargs pnpm test
  image:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Match existing Enterprise image edition
        run: printf '\nENV CW_EDITION="ee"\n' >> docker/Dockerfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/multiplusonline/chatwoot:instagram-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        run: echo 'Image digest ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
